<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RepoLens</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #d7dbe3;
    --dim: #7c8394;
    --accent: #5eead4;
    --high: #f0654c;
    --medium: #f5a623;
    --low: #7c8394;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  code, .mono, input, .tag, .num {
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 96px; }

  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { color: var(--dim); margin: 0 0 28px; font-size: 14px; }

  .prompt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
    background: var(--panel); border-radius: 8px; padding: 10px 14px; }
  .prompt span { color: var(--accent); }
  .prompt input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; }
  .prompt button { background: var(--accent); color: #06231f; border: none; border-radius: 6px;
    padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .prompt button:disabled { opacity: 0.5; cursor: default; }

  .status { margin-top: 14px; color: var(--dim); font-size: 13px; min-height: 18px; }
  .error { color: var(--high); }

  section.block { margin-top: 40px; }
  section.block h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--dim); font-weight: 600; margin: 0 0 14px; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .stat { border-top: 1px solid var(--border); padding-top: 8px; }
  .stat .num { font-size: 22px; color: var(--text); }
  .stat .label { font-size: 12px; color: var(--dim); }

  .lang-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .lang-row .name { width: 100px; flex-shrink: 0; }
  .lang-row .bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .lang-row .bar-fill { height: 100%; background: var(--accent); }
  .lang-row .pct { width: 46px; text-align: right; color: var(--dim); }

  .health-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .health-row .name { width: 130px; flex-shrink: 0; color: var(--dim); }
  .health-row .bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .health-row .bar-fill { height: 100%; }
  .health-row .score { width: 30px; text-align: right; }

  .item { border-top: 1px solid var(--border); padding: 12px 0; }
  .item .head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
  .tag.HIGH { background: rgba(240,101,76,0.15); color: var(--high); }
  .tag.MEDIUM { background: rgba(245,166,35,0.15); color: var(--medium); }
  .tag.LOW { background: rgba(124,131,148,0.2); color: var(--low); }
  .loc { color: var(--dim); }
  .msg { margin: 6px 0 0; font-size: 13px; }
  .suggestion { margin: 4px 0 0; font-size: 12px; color: var(--dim); }
  .empty { color: var(--dim); font-size: 13px; }

  .ai-summary { border-left: 2px solid var(--accent); padding: 4px 0 4px 16px;
    font-size: 14px; line-height: 1.6; color: var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <h1>RepoLens</h1>
    <p>Paste a public GitHub repository. Get a structured technical audit — no invented findings, every issue traced to a file and line.</p>
  </header>

  <div class="prompt">
    <span>$</span>
    <input id="repoUrl" type="text" placeholder="https://github.com/owner/repo" />
    <button id="analyzeBtn">Analyze</button>
  </div>
  <div class="status" id="status"></div>

  <div id="results" style="display:none">
    <section class="block">
      <h2>Overview</h2>
      <div class="stat-grid" id="overviewStats"></div>
      <div id="languages" style="margin-top:20px"></div>
    </section>

    <section class="block">
      <h2>Project health</h2>
      <div id="health"></div>
    </section>

    <section class="block">
      <h2>Code issues</h2>
      <div id="issues"></div>
    </section>

    <section class="block">
      <h2>Security</h2>
      <div id="security"></div>
    </section>

    <section class="block">
      <h2>Dependencies</h2>
      <div id="dependencies"></div>
    </section>

    <section class="block" id="aiSection" style="display:none">
      <h2>Analyst summary</h2>
      <p class="ai-summary" id="aiSummary"></p>
    </section>
  </div>
</main>

<script>
  // Point this at wherever the backend is actually running.
  const API_BASE = "http://127.0.0.1:8000";

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const resultsEl = $("results");
  const btn = $("analyzeBtn");
  const input = $("repoUrl");

  function healthColor(score) {
    if (score >= 75) return "#5eead4";
    if (score >= 50) return "#f5a623";
    return "#f0654c";
  }

  function renderOverview(o) {
    $("overviewStats").innerHTML = `
      <div class="stat"><div class="num">${o.total_files}</div><div class="label">files</div></div>
      <div class="stat"><div class="num">${o.total_lines.toLocaleString()}</div><div class="label">lines</div></div>
      <div class="stat"><div class="num">${o.total_functions}</div><div class="label">functions</div></div>
      <div class="stat"><div class="num">${o.total_classes}</div><div class="label">classes</div></div>
    `;
    $("languages").innerHTML = o.languages.map(l => `
      <div class="lang-row">
        <span class="name">${l.language}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${l.percentage}%"></div></div>
        <span class="pct">${l.percentage}%</span>
      </div>
    `).join("");
  }

  function renderHealth(h) {
    const rows = [
      ["Code quality", h.code_quality],
      ["Security", h.security],
      ["Performance", h.performance],
      ["Maintainability", h.maintainability],
      ["Documentation", h.documentation],
    ];
    $("health").innerHTML = rows.map(([name, score]) => `
      <div class="health-row">
        <span class="name">${name}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${score}%;background:${healthColor(score)}"></div></div>
        <span class="score">${score}</span>
      </div>
    `).join("");
  }

  function renderIssues(containerId, items, renderItem, emptyText) {
    const el = $(containerId);
    if (!items.length) {
      el.innerHTML = `<p class="empty">${emptyText}</p>`;
      return;
    }
    el.innerHTML = items.map(renderItem).join("");
  }

  function renderDependencies(deps) {
    if (!deps.length) {
      $("dependencies").innerHTML = `<p class="empty">No requirements.txt found.</p>`;
      return;
    }
    $("dependencies").innerHTML = deps.map(report => `
      <p class="empty">${report.manifest} — ${report.total} dependencies, ${report.vulnerable_count} with known vulnerabilities</p>
      ${report.dependencies.filter(d => d.vulnerabilities.length).map(d => `
        <div class="item">
          <div class="head"><span class="tag HIGH">VULN</span> <span class="loc">${d.name}${d.version ? " " + d.version : ""}</span></div>
          <p class="suggestion">${d.vulnerabilities.join(", ")}</p>
        </div>
      `).join("")}
    `).join("");
  }

  async function analyze() {
    const repoUrl = input.value.trim();
    if (!repoUrl) return;

    btn.disabled = true;
    resultsEl.style.display = "none";
    statusEl.className = "status";
    statusEl.textContent = "Cloning and analyzing — this can take a moment for larger repos...";

    try {
      const res = await fetch(`${API_BASE}/analyze`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repo_url: repoUrl }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();

      renderOverview(data.overview);
      renderHealth(data.health);
      renderIssues("issues", data.issues, (i) => `
        <div class="item">
          <div class="head"><span class="tag ${i.severity}">${i.severity}</span>
            <span class="loc">${i.file}${i.line ? ":" + i.line : ""}</span></div>
          <p class="msg">${i.message}</p>
          ${i.suggestion ? `<p class="suggestion">${i.suggestion}</p>` : ""}
        </div>
      `, "No code issues found by the current checks.");
      renderIssues("security", data.security, (s) => `
        <div class="item">
          <div class="head"><span class="tag ${s.severity}">${s.severity}</span>
            <span class="loc">${s.file}${s.line ? ":" + s.line : ""}</span></div>
          <p class="msg">${s.issue}</p>
        </div>
      `, "No security findings from Bandit.");
      renderDependencies(data.dependencies);

      if (data.ai_summary) {
        $("aiSection").style.display = "block";
        $("aiSummary").textContent = data.ai_summary;
      } else {
        $("aiSection").style.display = "none";
      }

      resultsEl.style.display = "block";
      statusEl.textContent = "";
    } catch (err) {
      statusEl.className = "status error";
      statusEl.textContent = err.message || "Something went wrong.";
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", analyze);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") analyze(); });
</script>
</body>
</html>
